name: CI

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-compat.txt
      - name: Install runtime and verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-compat.txt
          "build>=1.2"
          "mypy>=2.3"
          "pyright>=1.1.414"
          "setuptools>=80"
          "setuptools-scm>=9.2"
          "wheel"
      - name: Build outside checkout and verify complete consumer surface
        run: python -m tests.verify_compatibility
