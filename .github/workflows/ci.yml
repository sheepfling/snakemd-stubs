name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        snakemd-version: ["2.4.0", "2.4.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]" "SnakeMD==${{ matrix.snakemd-version }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy tests
      - run: pyright
      - run: stubtest --allowlist stubtest-allowlist.txt snakemd

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install --upgrade twine
      - run: twine check dist/*
