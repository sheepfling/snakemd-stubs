name: CI

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target-python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - if: ${{ matrix.target-python == '3.12' }}
        uses: sheepfling/alphus/ci/quality@b4b6055a6ae0286912b461cd2b4262b3318c5a0c
        with:
          requirements-file: requirements-verification.txt
          runtime-requirements-file: requirements-compat.txt
          config-file: quality-gates.toml
          profile: quality
      - uses: sheepfling/alphus/ci/stub-quality@b4b6055a6ae0286912b461cd2b4262b3318c5a0c
        with:
          python-version: "3.12"
          target-python-version: ${{ matrix.target-python }}
          requirements-file: requirements-compat.txt
          target-requirements-file: requirements-target.txt
          config-file: stub-quality.json
          with-twine: "true"
