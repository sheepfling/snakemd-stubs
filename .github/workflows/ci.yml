name: CI

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-compat.txt
      - name: Install runtime and verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-compat.txt
          "build>=1.2"
          "mypy>=2.3"
          "pyright>=1.1.414"
      - name: Build distributions
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --disable-pip-version-check --no-deps dist/*.whl
      - name: Prepare isolated consumer fixture
        run: |
          mkdir -p "$RUNNER_TEMP/consumer-fixture/tests"
          cp tests/typecheck.py "$RUNNER_TEMP/consumer-fixture/tests/typecheck.py"
          cp pyproject.toml "$RUNNER_TEMP/consumer-fixture/pyproject.toml"
          cp stubtest-allowlist.txt "$RUNNER_TEMP/consumer-fixture/stubtest-allowlist.txt"
      - name: Check consumer fixtures with mypy
        working-directory: ${{ runner.temp }}/consumer-fixture
        run: mypy tests
      - name: Check consumer fixtures with Pyright
        working-directory: ${{ runner.temp }}/consumer-fixture
        run: pyright
      - name: Check stubs against SnakeMD runtime
        working-directory: ${{ runner.temp }}/consumer-fixture
        run: stubtest --allowlist stubtest-allowlist.txt snakemd
