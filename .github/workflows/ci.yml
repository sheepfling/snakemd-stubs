name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target-python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: checker
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        id: target
        with:
          python-version: ${{ matrix.target-python }}
      - name: Run shared CI checks
        run: |
          "${{ steps.checker.outputs.python-path }}" -m tests.run_ci \
            --target-python "${{ steps.target.outputs.python-path }}"
