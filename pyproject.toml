[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snakemd-stubs"
dynamic = ["version"]
description = "PEP 561 type stubs for SnakeMD."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sheepfling"}]
requires-python = ">=3.10,<4.0"
dependencies = ["SnakeMD>=2.4.0,<2.5.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Stubs Only",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=2.3",
    "pre-commit>=4.0",
    "pyright>=1.1.414",
    "ruff>=0.16",
    "setuptools>=80",
    "setuptools-scm>=9.2",
    "twine>=7.0",
    "wheel",
]

[project.urls]
Repository = "https://github.com/sheepfling/snakemd-stubs"
Issues = "https://github.com/sheepfling/snakemd-stubs/issues"
SnakeMD = "https://github.com/TheRenegadeCoder/SnakeMD"

[tool.setuptools]
packages = ["snakemd-stubs"]

[tool.setuptools.package-data]
"snakemd-stubs" = ["*.pyi"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pyright]
include = ["tests/typecheck.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingModuleSource = "none"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
