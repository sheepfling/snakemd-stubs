[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snakemd-stubs"
dynamic = ["version"]
description = "PEP 561 type stubs for SnakeMD."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sheepfling"}]
requires-python = ">=3.10,<4.0"
dependencies = ["SnakeMD>=2.4.0,<2.5.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Stubs Only",
]

[dependency-groups]
dev = [
    "alphus @ git+https://github.com/sheepfling/alphus.git@v0.0.3",
    "build>=1.2",
    "mdrepo>=0.0.1.post0",
    "mypy>=2.3",
    "pre-commit>=4.0",
    "pyright>=1.1.414",
    "pytest>=7.4",
    "ruff>=0.16",
    "rumdl>=0.2.77",
    "ty>=0.0.95",
    "setuptools>=80",
    "setuptools-scm>=10",
    "twine>=7.0",
    "wheel",
]
target = [
    "build>=1.2",
    "mypy>=2.3",
    "pytest>=7.4",
    "setuptools>=80",
    "setuptools-scm>=10",
    "wheel",
    "typing_extensions>=4.0",
    "SnakeMD==2.4.1",
]
dev-experimental = [
    "alphus @ git+https://github.com/sheepfling/alphus.git@v0.0.3",
]
[project.urls]
Repository = "https://github.com/sheepfling/snakemd-stubs"
Issues = "https://github.com/sheepfling/snakemd-stubs/issues"
SnakeMD = "https://github.com/TheRenegadeCoder/SnakeMD"

[tool.setuptools]
packages = ["snakemd-stubs"]

[tool.setuptools.package-data]
"snakemd-stubs" = ["*.pyi"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.setuptools_scm.tag]
regex = '^v(?P<version>(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*)){3})$'

[tool.mypy]
python_version = "3.10"
strict = true
# This consumer fixture is checked in installed-target lanes, not checker tooling.
exclude = ["^tests/typecheck\\.py$"]

# Scope Pyright to the installed-package consumer fixture; audit/test helpers
# have separate checks and are not part of the public type-consumer probe.
[tool.pyright]
include = ["tests/typecheck.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingModuleSource = "none"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
